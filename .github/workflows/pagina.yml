# Publica la página del proyecto y la demo en GitHub Pages cada vez que cambia main.
# En el repositorio: Settings → Pages → Source: GitHub Actions.
name: Página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias (sin descargar Electron, la página no lo usa)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Armar la página y la demo
        run: npm run sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
